name = "hades-army"
main = "src/worker.ts"
compatibility_date = "2026-06-16"
compatibility_flags = ["nodejs_compat"]

# D1 Database — set manually in Cloudflare Dashboard
[[d1_databases]]
binding = "HADES_D1"
database_name = "hades-db"
database_id = "YOUR_D1_DATABASE_ID"

# KV Namespace — set manually in Cloudflare Dashboard
[[kv_namespaces]]
binding = "HADES_KV"
id = "YOUR_KV_NAMESPACE_ID"

[vars]
HADES_VERSION = "0.2.1"
OPENROUTER_BASE_URL = "https://openrouter.ai/api/v1"
GITHUB_API_BASE_URL = "https://api.github.com"

# Manager → Google AI Studio (no "google/" prefix for direct Google API)
DEFAULT_MANAGER_MODEL = "gemini-3-flash"

# Builder → OpenRouter
DEFAULT_BUILDER_MODEL = "qwen/qwen3-coder"

# Reviewer → OpenRouter
DEFAULT_REVIEWER_MODEL = "deepseek/deepseek-v3.1"

# Secrets (set via: wrangler secret put <NAME>)
# TELEGRAM_BOT_TOKEN
# OPENROUTER_API_KEY
# GITHUB_TOKEN
# ENCRYPTION_KEY
# GOOGLE_AI_API_KEY (required for Manager)
