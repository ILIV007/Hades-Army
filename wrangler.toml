name = "hades-army"
main = "src/index.ts"
compatibility_date = "2024-06-14"
compatibility_flags = ["nodejs_compat"]

# ============================================
# D1 Database
# ============================================
[[d1_databases]]
binding = "HADES_DB"
database_name = "hades-db"
database_id = "42b01656-7635-46e6-96af-33fad04da241"

# ============================================
# KV Namespace
# ============================================
[[kv_namespaces]]
binding = "HADES_KV"
id = "85b04bb029a243a4bb4a7f45e841390a"

# ============================================
# R2 Bucket — RESERVED FOR FUTURE USE (v0.10+)
# Uncomment when R2 is provisioned:
# [[r2_buckets]]
# binding = "HADES_R2"
# bucket_name = "hades-bucket"
# ============================================

# ============================================
# AI Binding (Cloudflare Workers AI — free tier)
# ============================================
[ai]
binding = "AI"

# ============================================
# Environment Variables (non-secret)
# ============================================
[vars]
NODE_ENV = "production"
LOG_LEVEL = "info"
HADES_VERSION = "9.4"

# ============================================
# Secrets — set with: wrangler secret put <NAME>
#
# CRITICAL (Worker starts in degraded mode without these):
#   TELEGRAM_BOT_TOKEN     — Telegram bot token from @BotFather
#   GITHUB_TOKEN           — GitHub PAT with repo scope
#   GOOGLE_AI_API_KEY      — Google AI Studio (Gemini 3 Flash) — Manager
#   OPENROUTER_API_KEY     — OpenRouter (Qwen3-Coder + DeepSeek) — Builder + Reviewer
#   ADMIN_API_TOKEN        — Admin token for REST API (min 16 chars)
#   JWT_SECRET             — JWT signing secret (min 32 chars)
#   ENCRYPTION_KEY         — At-rest encryption key (min 32 chars)
#
# RECOMMENDED:
#   API_KEYS               — Comma-separated API keys for REST API
#   GITHUB_WEBHOOK_SECRET  — GitHub webhook signature verification
#
# OPTIONAL (legacy fallback):
#   OPENAI_API_KEY         — Legacy OpenAI fallback
#   ANTHROPIC_API_KEY      — Legacy Anthropic fallback
# ============================================

# ============================================
# Cron Triggers — DISABLED in v0.9.2
# ============================================
# Cloudflare reported: "Some triggers failed to deploy" because the
# scheduled handler in src/index.ts calls services that need secrets
# not yet present at deploy time.
#
# Per v0.9.2 spec: cron triggers are REMOVED until the following
# features are properly implemented and tested:
#   - Memory Cleanup (background)
#   - Background Jobs queue
#   - Learning Engine
#   - Queue Processing
#
# To re-enable, UNCOMMENT the section below AND ensure the `scheduled`
# handler in src/index.ts is also restored. The handler has been
# reduced to a no-op logger in v0.9.2.
#
# [triggers]
# crons = ["*/5 * * * *", "0 * * * *", "0 0 * * *"]

# ============================================
# Build
# ============================================
# Hades Army is a TypeScript-only Worker — no build step is required.
# Wrangler bundles TypeScript natively via esbuild, so we intentionally
# omit the [build] section. This fixes the previous "Missing script: build"
# error that was blocking Cloudflare Pages deploy.
#
# If you later need a pre-deploy build (e.g. codegen), add:
#   [build]
#   command = "npm run build"
# and ensure package.json has a matching "build" script.
