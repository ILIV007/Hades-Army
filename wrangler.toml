name = "hades-army-v0.6"
main = "src/core/worker.ts"
compatibility_date = "2024-06-20"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "hades-army-db"
database_id = "your-database-id-here"

# KV Namespaces
[[kv_namespaces]]
binding = "KV_CACHE"
id = "your-kv-cache-id"

[[kv_namespaces]]
binding = "KV_SESSIONS"
id = "your-kv-sessions-id"

[[kv_namespaces]]
binding = "KV_PROJECTS"
id = "your-kv-projects-id"

# Environment Variables
[vars]
ENVIRONMENT = "production"
GITHUB_WEBHOOK_SECRET = ""
TELEGRAM_BOT_TOKEN = ""
OPENROUTER_API_KEY = ""
GOOGLE_AI_API_KEY = ""

# Secrets (use wrangler secret put)
# GITHUB_TOKEN
# OPENROUTER_API_KEY
# GOOGLE_AI_API_KEY
# TELEGRAM_BOT_TOKEN
# JWT_SECRET
# ENCRYPTION_KEY

# R2 Bucket for file storage
[[r2_buckets]]
binding = "FILE_STORAGE"
bucket_name = "hades-army-files"

# Queue for background jobs
[[queues.producers]]
binding = "JOB_QUEUE"
queue = "hades-army-jobs"

[[queues.consumers]]
queue = "hades-army-jobs"
max_batch_size = 10
max_batch_timeout = 30
