name = "hades-army"
main = "src/index.ts"
compatibility_date = "2024-06-14"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "HADES_DB"
database_name = "hades-db"
database_id = "your-database-id-here"

# KV Namespace
[[kv_namespaces]]
binding = "HADES_KV"
id = "your-kv-namespace-id-here"

# R2 Bucket
[[r2_buckets]]
binding = "HADES_R2"
bucket_name = "hades-bucket"

# AI Binding
[ai]
binding = "AI"

# Environment Variables
[vars]
NODE_ENV = "production"
LOG_LEVEL = "info"

# Secrets (use `wrangler secret put`)
# TELEGRAM_BOT_TOKEN
# OPENAI_API_KEY
# ANTHROPIC_API_KEY
# GITHUB_TOKEN
# ADMIN_API_TOKEN
# API_KEYS

# Cron Triggers
[[triggers]]
crons = ["*/5 * * * *", "0 * * * *", "0 0 * * *"]

# Build
[build]
command = "npm run build"
